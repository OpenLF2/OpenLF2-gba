# SPDX-License-Identifier: MIT
name: Build GBA ROM

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The original game data is not in this repository. The build downloads the public archive.org copy of the
  # Little Fighter 2 v2.0a installer and refuses any other file. Set the repository variable INSTALLER_URL to use
  # a different mirror that serves the same file.
  INSTALLER_URL: ${{ vars.INSTALLER_URL || 'https://web.archive.org/web/20260921121026id_/https://lf2.net/LF2_v2.0a.exe' }}
  INSTALLER_SHA256: 540c485547e234b0d09595f54d067aafd7176092c308aca61868f3cbc03030e1

jobs:
  rom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the ARM toolchain and Python libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib make python3 python3-numpy python3-pil ffmpeg

      - name: Download the game data
        run: |
          curl --fail --location --retry 3 --output LF2_v2.0a.exe "$INSTALLER_URL"
          echo "$INSTALLER_SHA256  LF2_v2.0a.exe" | sha256sum --check

      - name: Build the ROM
        run: make INSTALLER=LF2_v2.0a.exe

      - name: Check the ROM header
        run: |
          python3 - <<'PY'
          rom = open("build/openlf2.gba", "rb").read()
          assert len(rom) >= 1 << 20 and len(rom) & (len(rom) - 1) == 0, "size must be a power of two"
          assert rom[0xB2] == 0x96, "fixed header byte"
          assert rom[0x04:0xA0] == open("build/boot_logo.bin", "rb").read(), "boot logo"
          assert (-(sum(rom[0xA0:0xBD]) + 0x19)) & 0xFF == rom[0xBD], "header checksum"
          print(f"ROM OK: {len(rom) // 1024} KiB, header valid")
          PY

      - name: Build the browser converter site
        run: |
          mkdir wasm-modules && npm install --prefix wasm-modules pyodide@0.27.7 @ffmpeg/core@0.12.10
          python3 tools/make_web_site.py build/openlf2.gba build/assets site \
            --installer LF2_v2.0a.exe --modules wasm-modules

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload the ROM
        uses: actions/upload-artifact@v4
        with:
          name: openlf2-gba
          path: build/openlf2.gba
          if-no-files-found: error
          retention-days: 14

  # The site holds the prebuilt code and the converter, no game data: the visitor's browser downloads the installer
  # and converts it into the ROM.
  pages:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: rom
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
